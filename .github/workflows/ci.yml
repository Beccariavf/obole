name: CI

# Trois jobs indépendants :
#  - backend  : lint, types, tests hors réseau, audit des dépendances ;
#  - frontend : tests unitaires du front (parité seuils/régression + unitaires) ;
#  - e2e      : smoke Playwright (Chromium + WebKit) — démarre le vrai serveur,
#               donc dépend du réseau (yfinance) pour la fiche RI.PA.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Types (mypy, périmètre engine/ + services/ + mcp/ + models.py)
        run: mypy src/obole/engine src/obole/services src/obole/mcp src/obole/models.py
      - name: Tests (hors réseau)
        run: pytest -m "not network" -q
      - name: Audit des vulnérabilités
        run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - run: npm ci
      - name: Tests front (parité + unitaires)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Installer les dépendances Python
        run: pip install -e "..[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - run: npm ci
      - name: Installer les navigateurs (Chromium + WebKit)
        run: npx playwright install --with-deps chromium webkit
      - name: Smoke e2e
        run: npm run test:e2e
        env:
          OBOLE_SERVER_CMD: python -u ../run.py
